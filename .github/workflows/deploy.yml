name: Deploy to production (FTP)

# Auto-deploys on every push to claude/rebuild-talebert-childcare-7me8jp —
# this repo's current default branch (there is no "main" yet). A manual
# "Run workflow" button in the Actions tab still works as a fallback.
#
# Once this branch is merged into a permanent "main" and that becomes the
# default branch, update the branch name below to "main" so deploys keep
# firing automatically without a manual step.
on:
  push:
    branches: [claude/rebuild-talebert-childcare-7me8jp]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          # public_html is the FTP login's landing folder, so repo root -> "/"
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tools/**
            **/assets/originals/**
            **/BRAND.md
            **/CLAUDE.md
